<h1>მინი-მაღაზია</h1>

<button (click)="cartOpen.set(true)">
  კალათა ({{ count() }}) - {{ total() }} ₾
</button>
<button (click)="viewedOpen.set(!viewedOpen())">ბოლოს ნანახი</button>

@if (viewedOpen()) {
  <app-recently-viewed />
}

<hr />

@for (p of products; track p.id) {
  <div>
    <span>{{ p.name }} - {{ p.price }} ₾</span>
    <button (click)="view(p)">ნახვა</button>
    <button (click)="add(p)">დამატება</button>
  </div>
}

@if (cartOpen()) {
  <div class="cart">
    <h2>კალათა</h2>

    @for (p of cart(); track $index) {
      <div>
        <span>{{ p.name }} - {{ p.price }} ₾</span>
        <button (click)="remove($index)">წაშლა</button>
      </div>
    } @empty {
      <p>კალათა ცარიელია</p>
    }

    <button (click)="cartOpen.set(false)">დახურვა</button>
    <button (click)="pay()" [disabled]="paying() || cart().length === 0">
      {{ paying() ? 'მიმდინარეობს...' : 'გადახდა' }}
    </button>
  </div>
}

@if (toast()) {
  <div class="toast">{{ toast() }}</div>
}
